[project]
name = "sequoia-project"
version = "0.1.0"
description = "Replace with the engineering project's purpose."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
# Choose the project license with its owners before distributing the code.

[dependency-groups]
dev = [
    "ruff==0.16.10",
    "mypy>=1.10,<3",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "pre-commit>=4,<5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
xfail_strict = true
markers = [
    "gpu: requires a GPU and the project's compatible ML environment",
    "integration: requires services, real data or infrastructure",
    "slow: exceeds the ordinary pull request test budget",
]

[tool.coverage.run]
branch = true
source = ["sequoia_project"]

[tool.coverage.report]
show_missing = true
# Agree a meaningful threshold once application behavior is covered.
