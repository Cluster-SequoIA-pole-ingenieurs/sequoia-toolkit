workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH'

stages:
  - check

default:
  # Keep the image's Python version aligned with .python-version.
  image: python:3.12
  interruptible: true
  before_script:
    - python -m pip install uv==0.13.1
    - uv sync --locked --no-python-downloads

quality:
  stage: check
  timeout: 10 minutes
  script:
    - uv run --locked pre-commit run --all-files --show-diff-on-failure
    - uv run --locked mypy

cpu-tests:
  stage: check
  timeout: 10 minutes
  script:
    - uv run --locked pytest -m 'not gpu and not integration and not slow' --cov --cov-report=term-missing --junitxml=junit.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: junit.xml
