name: Revue des dependances

# Sur chaque PR : bloque l'ajout d'une dependance ayant une vulnerabilite connue
# (severite moderee ou plus). Une politique de licences peut etre ajoutee
# via les options allow-licenses / deny-licenses.
on:
  pull_request:

permissions:
  contents: read

jobs:
  revue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
