name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Reutilise par release.yml : aucune release sans CI verte sur le tag.
  workflow_call:

# Jeton en lecture seule par defaut ; un job qui a besoin de plus le declare.
permissions:
  contents: read

# Un nouveau push sur une PR annule le run precedent devenu obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions epinglees par SHA (le tag correspondant est en commentaire) :
# Dependabot met a jour les deux ensemble.
jobs:
  qualite:
    name: Lint, format et typage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      # pre-commit est la source de verite pour ruff et les hooks de fichiers :
      # memes versions en local et en CI.
      - name: Hooks pre-commit (ruff, format, fichiers)
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Typage
        run: mypy src examples

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: pip install -e ".[dev]"
      - name: Tests unitaires (Slurm et PBS simules, garde-fous d'architecture)
        run: pytest

  integration-slurm:
    name: Integration (vrai Slurm)
    # Soumet de vrais jobs a un Slurm installe sur le runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - name: Installer un Slurm mono-noeud
        run: sudo ci/setup-slurm.sh
      - name: Tests d'integration
        run: pytest -m integration --no-cov -v
      - name: Journaux Slurm en cas d'echec
        if: failure()
        run: sudo tail -n 100 /var/log/slurm/*.log

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[docs]"
      - name: Construire la doc (avertissements = erreurs)
        run: mkdocs build --strict

  paquet:
    name: Construction du paquet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: Construire wheel et sdist
        run: python -m build
      - name: Verifier les metadonnees
        run: twine check --strict dist/*
      - name: Installer la wheel hors du depot et l'importer
        run: |
          python -m venv /tmp/venv-wheel
          /tmp/venv-wheel/bin/pip install dist/*.whl
          cd /tmp && /tmp/venv-wheel/bin/python -c "import sequoia_toolkit, sequoia_toolkit.core, sequoia_toolkit.hpc, sequoia_toolkit.data, sequoia_toolkit.ml; print(sequoia_toolkit.__version__)"
          /tmp/venv-wheel/bin/sequoia-job --help > /dev/null
