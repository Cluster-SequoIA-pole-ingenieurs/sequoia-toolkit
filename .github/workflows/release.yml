name: Release

# Sur un tag vX.Y.Z : construit le paquet et cree une GitHub Release avec
# les fichiers wheel/sdist attaches. Aucun index de paquets requis.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build && python -m build
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
