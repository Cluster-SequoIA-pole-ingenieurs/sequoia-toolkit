[build-system]
# >= 1.27 : prise en charge de `license` au format SPDX (PEP 639).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sequoia-toolkit"
version = "0.2.0"
description = "Boite a outils reutilisable de l'equipe ingenierie du Cluster SequoIA (HPC Slurm/PBS, IA/ML, donnees)."
readme = "README.md"
requires-python = ">=3.10"
license = "EUPL-1.2"
authors = [
    { name = "Equipe Ingenierie Cluster SequoIA", email = "sequoia-ingenierie@univ-rennes.fr" }
]
keywords = ["sequoia", "hpc", "slurm", "pbs", "torque", "ia", "machine-learning", "univ-rennes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Science/Research",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Dependances du socle uniquement : l'installation de base reste legere.
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Dependances lourdes, installees seulement par les projets qui en ont besoin.
tracking = ["mlflow>=2.15"]
object-storage = []   # ex: "boto3>=1.34", a remplir au premier besoin reel
gpu = []              # ex: "torch>=2.3", a aligner sur le module CUDA du cluster
all = ["sequoia-toolkit[tracking,object-storage,gpu]"]
# ruff : meme version que dans .pre-commit-config.yaml (verifie par tests/test_outillage.py).
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.16.10",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
]
# mkdocs < 2 : MkDocs 2.0 supprime le systeme de plugins (mkdocstrings, material).
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "mkdocstrings[python]>=0.25"]

[project.scripts]
sequoia-job = "sequoia_toolkit.hpc.cli:main"

[project.urls]
Homepage = "https://github.com/Cluster-SequoIA-pole-ingenieurs/sequoia-toolkit"
Issues = "https://github.com/Cluster-SequoIA-pole-ingenieurs/sequoia-toolkit/issues"
Changelog = "https://github.com/Cluster-SequoIA-pole-ingenieurs/sequoia-toolkit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/sequoia_toolkit"]

[tool.hatch.build.targets.sdist]
# Le sdist garde sources, tests, docs et exemples, sans l'outillage du depot.
exclude = [".github", "ci", ".pre-commit-config.yaml", ".editorconfig"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config -m 'not integration' --cov=sequoia_toolkit --cov-report=term-missing"
testpaths = ["tests"]
xfail_strict = true
markers = ["integration: necessite un vrai ordonnanceur (Slurm ou PBS)"]

[tool.coverage.run]
branch = true
source = ["sequoia_toolkit"]

[tool.coverage.report]
# La CI echoue si la couverture passe sous ce seuil.
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
