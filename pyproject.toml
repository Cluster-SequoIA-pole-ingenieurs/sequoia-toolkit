[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sequoia-toolkit"
version = "0.1.0"
description = "Boite a outils reutilisable de l'equipe ingenierie du Cluster SequoIA (HPC/Slurm, IA/ML, donnees)."
readme = "README.md"
requires-python = ">=3.10"
license = "EUPL-1.2"
authors = [
    { name = "Equipe Ingenierie Cluster SequoIA", email = "sequoia-ingenierie@univ-rennes.fr" }
]
keywords = ["sequoia", "hpc", "slurm", "ia", "machine-learning", "univ-rennes"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Dependances du socle uniquement : l'installation de base reste legere.
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Dependances lourdes, installees seulement par les projets qui en ont besoin.
tracking = ["mlflow>=2.15"]
object-storage = []   # ex: "boto3>=1.34", a remplir au premier besoin reel
gpu = []              # ex: "torch>=2.3", a aligner sur le module CUDA du cluster
all = ["sequoia-toolkit[tracking,object-storage,gpu]"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10", "pre-commit>=3.7", "types-PyYAML"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[project.urls]
Homepage = "https://github.com/Cluster-SequoIA-pole-ingenieurs/sequoia-toolkit"
Issues = "https://github.com/Cluster-SequoIA-pole-ingenieurs/sequoia-toolkit/issues"
Changelog = "https://github.com/Cluster-SequoIA-pole-ingenieurs/sequoia-toolkit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/sequoia_toolkit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q --cov=sequoia_toolkit --cov-report=term-missing"
testpaths = ["tests"]
